name: Notify Parent Repo
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main, dev]
permissions:
  contents: read
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISPATCH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Notify existing parent integration
        if: env.DISPATCH_TOKEN != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const run = context.payload.workflow_run;
            await github.rest.repos.createDispatchEvent({
              owner: 'stephen-taipei',
              repo: 'stephen.taipei',
              event_type: 'submodule-updated',
              client_payload: {
                submodule: `${context.repo.owner}/${context.repo.repo}`,
                ref: `refs/heads/${run.head_branch}`,
                sha: run.head_sha
              }
            });
      - name: Integration not configured
        if: env.DISPATCH_TOKEN == ''
        run: echo 'Parent notification skipped because GH_PAT is not configured.'
