name: Codebase audit
on:
  push:
    branches: [audit/2026-09-24-codebase]
permissions:
  contents: read
jobs:
  migrate-and-verify:
    if: github.repository == 'stephen-taipei/awesome-free-games-1000'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/2026-09-24-codebase
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize audited source and lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          node scripts/normalize-pages.mjs --write
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/games/puzzle/game-001-2048/game.ts')
          s=p.read_text().replace("return parseInt(localStorage.getItem('game_001_2048_best') || '0', 10);", "const value = Number(localStorage.getItem('game_001_2048_best') || '0');\n      return Number.isSafeInteger(value) && value >= 0 ? value : 0;")
          p.write_text(s)
          p=Path('src/shared/utils/index.ts')
          s=p.read_text().replace('const mins = Math.floor(seconds / 60);\n  const secs = seconds % 60;', 'const total = Number.isFinite(seconds) ? Math.max(0, Math.floor(seconds)) : 0;\n  const mins = Math.floor(total / 60);\n  const secs = total % 60;')
          s=s.replace('    element.requestFullscreen();', '    void element.requestFullscreen().catch(() => {});').replace('    document.exitFullscreen();', '    void document.exitFullscreen().catch(() => {});')
          p.write_text(s)
          p=Path('src/shared/analytics/index.ts')
          s=p.read_text().replace('class Analytics {', 'export class Analytics {') if 'export class Analytics' not in p.read_text() else p.read_text()
          s=s.replace('  private measurementId: string | null = null;\n', '')
          s=s.replace('    if (this.initialized || !measurementId) return;\n\n    this.measurementId = measurementId;', "    if (this.initialized || !/^G-[A-Z0-9]+$/.test(measurementId)) return;\n    if (typeof window === 'undefined' || typeof document === 'undefined') return;\n    if (navigator.doNotTrack === '1' || (navigator as Navigator & { globalPrivacyControl?: boolean }).globalPrivacyControl) return;")
          s=s.replace('      console.log(`[Analytics] ${eventName}`, params);\n', '')
          p.write_text(s)
          p=Path('.gitignore')
          s=p.read_text()
          if 'test-results/' not in s: p.write_text(s+'\n# Browser test output\ntest-results/\nplaywright-report/\n')
          PY
          npm run generate:catalog
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games src/shared/utils/index.ts src/shared/analytics/index.ts package-lock.json public .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'fix: normalize all game pages and apply audited runtime repairs'
            git push origin HEAD:audit/2026-09-24-codebase
          fi
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Capture inspectable source and diagnostics
        if: always()
        run: |
          mkdir -p audit-output
          git archive HEAD -o audit-output/source.tar
          npm audit --json > audit-output/dependencies.json || true
          cp -R test-results audit-output/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audited-browser-results
          path: audit-output/
          retention-days: 7
