name: Codebase audit
on:
  push:
    branches: [audit/2026-09-24-codebase]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched toolchain
        run: |
          npm install --save-dev --save-exact vite@8.3.0 @playwright/test@latest
          mkdir -p audit-output
          cp package.json package-lock.json audit-output/
          npm audit --json > audit-output/dependencies.json || true
          tar -czf audit-output/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: audit-toolchain
          path: audit-output/
          retention-days: 7
