<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="金字塔接龍 Pyramid Solitaire：WebGL 3D 綠絨牌桌上的經典金字塔接龍。點兩張沒被壓住、合計 13 的牌消除，K 單獨移除，牌庫可走三輪，清空金字塔即獲勝。支援牌局編號重玩、提示與悔棋。" />
  <meta name="theme-color" content="#03140e" />
  <title>金字塔接龍 Pyramid Solitaire - Awesome Free Games 1000</title>
  <link rel="stylesheet" href="../../../shared/three/kit.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../../../shared/shell.css">
</head>
<body>
  <div class="g3d">
    <div id="stage" class="g3d-stage"></div>

    <div class="g3d-hud" id="hud">
      <div class="g3d-stats">
        <div class="g3d-chip accent"><small data-i18n="game.score">Score</small><b id="score">0</b></div>
        <div class="g3d-chip"><small data-i18n="game.time">Time</small><b id="time">0:00</b></div>
        <div class="g3d-chip"><small data-i18n="game.moves">Moves</small><b id="moves">0</b></div>
        <div class="g3d-chip"><small data-i18n="game.stock">Stock</small><b id="stock">24</b></div>
        <div class="g3d-chip"><small data-i18n="game.redeals">Redeals</small><b class="pips" id="redeals"></b></div>
        <div class="g3d-chip deal-chip"><small data-i18n="game.deal">Deal</small><b id="deal">#1</b></div>
      </div>
      <div class="g3d-actions">
        <span class="deal-tag" id="deal-tag">#1</span>
        <select id="language-select" class="g3d-select" data-i18n-aria="game.language" aria-label="Language / 語言">
          <option value="zh-TW">繁中</option>
          <option value="zh-CN">简中</option>
          <option value="en">EN</option>
          <option value="ja">日本語</option>
        </select>
        <button id="sound-btn" class="g3d-icon" type="button" data-i18n-aria="game.sound" aria-label="Toggle sound" aria-pressed="true">♪</button>
        <button id="pause-btn" class="g3d-icon" type="button" data-i18n-aria="game.pause" aria-label="Pause">❚❚</button>
      </div>
    </div>

    <div class="pyr-bar off" id="bar" role="toolbar" data-i18n-aria="game.toolbar" aria-label="Game tools">
      <button id="undo-btn" class="pyr-tool" type="button" data-i18n-aria="game.undo" aria-label="Undo"><span class="pyr-ico" aria-hidden="true">↶</span><small data-i18n="game.undo">Undo</small><kbd aria-hidden="true">Z</kbd></button>
      <button id="hint-btn" class="pyr-tool" type="button" data-i18n-aria="game.hint" aria-label="Hint"><span class="pyr-ico" aria-hidden="true">✦</span><small data-i18n="game.hint">Hint</small><kbd aria-hidden="true">H</kbd></button>
      <button id="draw-btn" class="pyr-tool primary" type="button" data-i18n-aria="game.draw" aria-label="Draw"><span class="pyr-ico" aria-hidden="true">⤒</span><small id="draw-label" data-i18n="game.draw">Draw</small><kbd aria-hidden="true">D</kbd></button>
      <button id="new-btn" class="pyr-tool" type="button" data-i18n-aria="game.newDeal" aria-label="New deal"><span class="pyr-ico" aria-hidden="true">↻</span><small data-i18n="game.newDeal">New deal</small><kbd aria-hidden="true">N</kbd></button>
    </div>

    <div id="toast" class="g3d-toast" role="status" aria-live="polite"></div>
    <div id="sr" class="visually-hidden" aria-live="polite"></div>

    <div id="overlay" class="g3d-overlay">
      <section class="g3d-panel" aria-labelledby="overlay-title">
        <p class="g3d-kicker" id="overlay-kicker" data-i18n="game.kicker">WebGL 3D card table</p>
        <h1 class="g3d-title" id="overlay-title" data-i18n="game.title">Pyramid Solitaire</h1>
        <p class="g3d-lead" id="overlay-lead" data-i18n="game.lead"></p>
        <p class="pyr-values" id="values" aria-hidden="true"><span>A <b>1</b></span><span>J <b>11</b></span><span>Q <b>12</b></span><span>K <b>13</b></span></p>
        <div id="result" class="g3d-result" hidden>
          <div><small data-i18n="game.score">Score</small><b id="result-score">0</b></div>
          <div><small data-i18n="game.time">Time</small><b id="result-time">0:00</b></div>
          <div><small data-i18n="game.moves">Moves</small><b id="result-moves">0</b></div>
          <div><small data-i18n="game.best">Best</small><b id="result-best">0</b><span id="new-best" class="g3d-badge" data-i18n="game.newBest" hidden>New best</span></div>
        </div>
        <p class="pyr-breakdown" id="breakdown" hidden></p>
        <ul class="g3d-keys" id="controls">
          <li><kbd>13</kbd><span data-i18n="game.keyRule"></span></li>
          <li><kbd data-i18n="game.click">Click</kbd><span data-i18n="game.keyPick"></span></li>
          <li><kbd>← → ↑ ↓</kbd><span data-i18n="game.keyMove"></span></li>
          <li><kbd>Enter / Space</kbd><span data-i18n="game.keySelect"></span></li>
          <li><kbd>D · H · Z</kbd><span data-i18n="game.keyTools"></span></li>
          <li><kbd>P / Esc</kbd><span data-i18n="game.keyPause"></span></li>
          <li class="touch-only"><kbd data-i18n="game.tap">Tap a card</kbd><span data-i18n="game.keyPick"></span></li>
          <li class="touch-only"><kbd data-i18n="game.tapStock">Tap the stock</kbd><span data-i18n="game.keyDraw"></span></li>
        </ul>
        <div class="pyr-deal-row" id="deal-row">
          <label for="deal-input" data-i18n="game.dealLabel">Deal number</label>
          <input id="deal-input" type="number" inputmode="numeric" min="1" max="999999" step="1" />
          <button id="dice-btn" class="g3d-icon" type="button" data-i18n-aria="game.dealRandom" aria-label="Random winnable deal">⚄</button>
        </div>
        <button id="start-btn" class="g3d-btn" type="button" data-i18n="game.start">Deal cards</button>
        <div class="pyr-row" id="secondary" hidden>
          <button id="undo-over-btn" class="pyr-btn2" type="button" data-i18n="game.undoLast">Undo last move</button>
          <button id="replay-btn" class="pyr-btn2" type="button">Replay</button>
          <button id="newdeal-btn" class="pyr-btn2" type="button" data-i18n="game.newDeal">New deal</button>
        </div>
        <p class="g3d-note" id="tip" data-i18n="game.tip"></p>
      </section>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
  <script type="module" src="../../../shared/shell.ts"></script>
</body>
</html>
