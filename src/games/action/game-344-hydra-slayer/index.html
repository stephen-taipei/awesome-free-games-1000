<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="斬獸試煉 Beastfall Trials：WebGL 2.5D 懸崖首領對決。看準巨獸發光的起手，格擋金光、翻滾閃過赤光，用專注終結技討伐三首獄犬、海妖、九頭蛇與深淵巨妖。" />
  <meta name="theme-color" content="#1a1030" />
  <link rel="icon" href="data:," />
  <title>斬獸試煉 Beastfall Trials - Awesome Free Games 1000</title>
  <link rel="stylesheet" href="../../../shared/three/kit.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../../../shared/shell.css">
</head>
<body data-mode="menu">
  <div class="g3d">
    <div id="stage" class="g3d-stage"></div>
    <div id="popups" class="popups" aria-hidden="true"></div>

    <div class="g3d-hud" id="hud">
      <div class="g3d-stats" id="stats">
        <div class="g3d-chip hero-chip" id="hero-chip">
          <small data-i18n="game.hero">Hero</small>
          <div class="g3d-meter hp-meter"><i id="hp-bar"></i></div>
          <div class="g3d-meter stamina-meter"><i id="stamina-bar"></i></div>
        </div>
        <div class="g3d-chip focus-chip" id="focus-chip">
          <small data-i18n="game.focus">Focus</small>
          <div class="g3d-meter focus-meter"><i id="focus-bar"></i></div>
        </div>
        <div class="g3d-chip beast-chip" id="beast-chip">
          <small><span id="beast-name">Hydra</span><span class="heads" id="heads" hidden><i></i><i></i><i></i></span></small>
          <div class="g3d-meter beast-meter"><i id="beast-bar"></i></div>
        </div>
        <div class="g3d-chip time-chip"><small data-i18n="game.time">Time</small><b id="time">0:00.0</b></div>
      </div>
      <div class="g3d-actions">
        <select id="language-select" class="g3d-select" data-i18n-aria="game.language" aria-label="Language / 語言">
          <option value="zh-TW">繁中</option>
          <option value="zh-CN">简中</option>
          <option value="en">EN</option>
          <option value="ja">日本語</option>
        </select>
        <button id="sound-btn" class="g3d-icon" type="button" data-i18n-aria="game.sound" aria-label="Toggle sound" aria-pressed="true">♪</button>
        <button id="pause-btn" class="g3d-icon" type="button" data-i18n-aria="game.pause" aria-label="Pause">❚❚</button>
      </div>
    </div>

    <div id="pad" class="pad" aria-hidden="true"><div id="stick" class="stick" hidden><i id="knob"></i></div></div>
    <div id="touch" class="g3d-touch fight-touch">
      <button id="btn-finisher" class="tb tb-finisher" type="button" data-i18n-aria="game.btnFinisher" aria-label="Finisher"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" class="fill"/></svg><small data-i18n="game.btnFinisher">Finisher</small></button>
      <button id="btn-dodge" class="tb tb-dodge" type="button" data-i18n-aria="game.btnDodge" aria-label="Dodge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 13.5a7.5 7.5 0 1 1-2.6-7.2M17.5 2.8v4h-4"/></svg><small data-i18n="game.btnDodge">Dodge</small></button>
      <button id="btn-parry" class="tb tb-parry" type="button" data-i18n-aria="game.btnParry" aria-label="Parry"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3l7 3v5c0 5-3.2 8.3-7 10-3.8-1.7-7-5-7-10V6z"/></svg><small data-i18n="game.btnParry">Parry</small></button>
      <button id="btn-attack" class="tb tb-attack" type="button" data-i18n-aria="game.btnAttack" aria-label="Attack"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 4l-1 4L9.5 17.5l-3-3L16 5zM5 13.5l5.5 5.5M7 18l-3 3"/></svg><small data-i18n="game.btnAttack">Attack</small></button>
    </div>

    <div id="toast" class="g3d-toast" role="status" aria-live="polite"></div>

    <div id="overlay" class="g3d-overlay">
      <section class="g3d-panel" aria-labelledby="overlay-title">
        <p class="g3d-kicker" id="overlay-kicker" data-i18n="game.kicker">WebGL boss duels</p>
        <h1 class="g3d-title" id="overlay-title" data-i18n="game.title">Beastfall Trials</h1>
        <p class="g3d-lead" id="overlay-lead" data-i18n="game.lead"></p>
        <ul class="legend" id="legend" data-i18n-aria="game.legend" aria-label="Attack colours">
          <li class="lg-gold" data-i18n="legend.gold">Gold: parry</li>
          <li class="lg-crimson" data-i18n="legend.crimson">Crimson: roll or step aside</li>
          <li class="lg-song" data-i18n="legend.song">Cyan notes: parry</li>
        </ul>
        <div id="ladder" class="ladder">
          <div class="tiers" role="group" data-i18n-aria="game.tierLabel" aria-label="Difficulty">
            <button id="tier-0" class="tier" type="button" aria-pressed="true" data-i18n="game.normal">Normal</button>
            <button id="tier-1" class="tier nightmare" type="button" aria-pressed="false" data-i18n="game.nightmare">Nightmare</button>
          </div>
          <div id="cards" class="cards"></div>
          <p id="ladder-hint" class="ladder-hint"></p>
        </div>
        <div id="result" class="g3d-result" hidden>
          <div><small data-i18n="game.time">Time</small><b id="result-time">0:00.0</b></div>
          <div><small data-i18n="game.perfects">Perfect parries</small><b id="result-perfects">0</b></div>
          <div><small data-i18n="game.hitsTaken">Hits taken</small><b id="result-hits">0</b></div>
          <div><small id="result-best-label">Best time</small><b id="result-best">—</b><span id="new-best" class="g3d-badge" data-i18n="game.newBest" hidden>New best</span></div>
        </div>
        <p id="result-note" class="result-note" hidden></p>
        <ul class="g3d-keys" id="controls">
          <li><kbd>A D / ← →</kbd><span data-i18n="game.keyMove"></span></li>
          <li><kbd>J / Space</kbd><span data-i18n="game.keyAttack"></span></li>
          <li><kbd>K / Shift</kbd><span data-i18n="game.keyParry"></span></li>
          <li><kbd>L / ↓ / S</kbd><span data-i18n="game.keyDodge"></span></li>
          <li><kbd>I / ↑ / W</kbd><span data-i18n="game.keyFinisher"></span></li>
          <li><kbd>P / Esc</kbd><span data-i18n="game.keyPause"></span></li>
          <li class="touch-only"><kbd data-i18n="game.touchPad"></kbd><span data-i18n="game.touchPadDesc"></span></li>
          <li class="touch-only"><kbd data-i18n="game.touchButtons"></kbd><span data-i18n="game.touchButtonsDesc"></span></li>
        </ul>
        <button id="start-btn" class="g3d-btn" type="button">Fight</button>
        <div id="more-btns" class="more-btns" hidden>
          <button id="retry-btn" class="g3d-btn ghost" type="button">Fight again</button>
          <button id="ladder-btn" class="g3d-btn ghost" type="button">Back to the trials</button>
        </div>
        <p class="g3d-note" id="overlay-note" data-i18n="game.tip"></p>
      </section>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
  <script type="module" src="../../../shared/shell.ts"></script>
</body>
</html>
