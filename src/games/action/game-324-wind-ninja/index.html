<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="疾風斬 Gale Cutter：WebGL 3D 浮空島衝刺斬擊。按住讓時間慢到 15% 並拉出瞄準線，放開就沿線斬開一切；盾兵要繞背、炸彈兵會連鎖，一次斬多個提高倍率，突破三座浮島 12 波後進入無盡模式。" />
  <meta name="theme-color" content="#0b1830" />
  <title>疾風斬 Gale Cutter - Awesome Free Games 1000</title>
  <link rel="stylesheet" href="../../../shared/three/kit.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../../../shared/shell.css">
</head>
<body>
  <div class="g3d">
    <div id="stage" class="g3d-stage"></div>
    <div id="vignette" class="vignette" aria-hidden="true"></div>
    <div id="hurt" class="hurt" aria-hidden="true"></div>
    <div id="popups" class="popups" aria-hidden="true"></div>

    <div class="g3d-hud" id="hud">
      <div class="g3d-stats" id="stats">
        <div class="g3d-chip accent score-chip">
          <small data-i18n="game.score">Score</small>
          <b><span id="score">0</span><em id="combo" class="combo" data-i18n-aria="game.combo" aria-label="Multiplier" hidden>×1</em></b>
          <span class="g3d-meter combo-meter"><i id="combo-bar"></i></span>
        </div>
        <div class="g3d-chip wave-chip"><small data-i18n="game.wave">Wave</small><b id="wave">1</b></div>
        <div class="g3d-chip"><small data-i18n="game.life">Life</small><b class="hearts" id="hearts"></b></div>
        <div class="g3d-chip dash-chip">
          <small data-i18n="game.dash">Dash</small>
          <b class="dashes" id="charges"></b>
          <span class="g3d-meter focus-meter"><i id="focus-bar"></i></span>
        </div>
      </div>
      <div class="g3d-actions" id="actions">
        <select id="language-select" class="g3d-select" data-i18n-aria="game.language" aria-label="Language / 語言">
          <option value="zh-TW">繁中</option>
          <option value="zh-CN">简中</option>
          <option value="en">EN</option>
          <option value="ja">日本語</option>
        </select>
        <button id="sound-btn" class="g3d-icon" type="button" data-i18n-aria="game.sound" aria-label="Toggle sound" aria-pressed="true">♪</button>
        <button id="pause-btn" class="g3d-icon" type="button" data-i18n-aria="game.pause" aria-label="Pause">❚❚</button>
      </div>
    </div>

    <div id="toast" class="g3d-toast" role="status" aria-live="polite"></div>
    <div id="hint" class="hint" aria-live="polite"></div>

    <div id="overlay" class="g3d-overlay">
      <section class="g3d-panel" aria-labelledby="overlay-title">
        <p class="g3d-kicker" id="overlay-kicker" data-i18n="game.kicker">WebGL sky-island dash slasher</p>
        <h1 class="g3d-title" id="overlay-title" data-i18n="game.title">Gale Cutter</h1>
        <p class="g3d-lead" id="overlay-lead" data-i18n="game.lead"></p>
        <div id="result" class="g3d-result" hidden>
          <div><small data-i18n="game.score">Score</small><b id="result-score">0</b></div>
          <div><small data-i18n="game.wave">Wave</small><b id="result-wave">1</b></div>
          <div><small data-i18n="game.kills">Foes cut</small><b id="result-kills">0</b></div>
          <div><small data-i18n="game.maxCombo">Top multiplier</small><b id="result-combo">×1</b></div>
          <div><small data-i18n="game.best">Best score</small><b id="result-best">0</b><span id="new-best" class="g3d-badge" data-i18n="game.newBest" hidden>New best</span></div>
          <div><small data-i18n="game.bestCombo">Best multiplier</small><b id="result-best-combo">×1</b><span id="new-best-combo" class="g3d-badge" data-i18n="game.newBest" hidden>New best</span></div>
        </div>
        <ul class="g3d-keys" id="controls">
          <li><kbd data-i18n="game.mouseHold"></kbd><span data-i18n="game.mouseHoldDo"></span></li>
          <li><kbd data-i18n="game.mouseRelease"></kbd><span data-i18n="game.mouseReleaseDo"></span></li>
          <li><kbd data-i18n="game.keySpace"></kbd><span data-i18n="game.keySpaceDo"></span></li>
          <li><kbd>P / Esc</kbd><span data-i18n="game.keyPause"></span></li>
          <li class="touch-only"><kbd data-i18n="game.touchDrag"></kbd><span data-i18n="game.touchDragDo"></span></li>
          <li class="touch-only"><kbd data-i18n="game.touchLift"></kbd><span data-i18n="game.touchLiftDo"></span></li>
        </ul>
        <button id="start-btn" class="g3d-btn" type="button" data-i18n="game.start">Start</button>
        <p class="g3d-note" id="overlay-note" data-i18n="game.tip"></p>
      </section>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
  <script type="module" src="../../../shared/shell.ts"></script>
</body>
</html>
