<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="山脊滑翔 Ridge Glider：WebGL 3D 翼裝飛行。沿著程序生成的山脊峽谷滑翔而下，俯衝換速度、拉起換高度，連穿光環累積倍率、搭熱氣流爬升，別讓越來越窄的峽谷追上你。" />
  <meta name="theme-color" content="#0d1b2a" />
  <title>山脊滑翔 Ridge Glider - Awesome Free Games 1000</title>
  <link rel="stylesheet" href="../../../shared/three/kit.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../../../shared/shell.css">
</head>
<body>
  <div class="g3d">
    <div id="stage" class="g3d-stage"></div>
    <div id="danger" class="danger" aria-hidden="true"></div>
    <div id="marker" class="gate-marker" aria-hidden="true" hidden><i></i></div>
    <div id="stick" class="stick" aria-hidden="true" hidden><i id="stick-knob"></i></div>
    <div id="pops" class="pops" aria-hidden="true"></div>

    <div class="g3d-hud">
      <div class="g3d-stats">
        <div class="g3d-chip accent"><small data-i18n="game.score">Score</small><b id="score">0</b></div>
        <div class="g3d-chip mult-chip" id="mult-chip"><small data-i18n="game.chain">Chain</small><b>×<span id="mult">1</span></b></div>
        <div class="g3d-chip"><small data-i18n="game.speed">Speed</small><b><span id="speed">0</span><em>km/h</em></b></div>
        <div class="g3d-chip height-chip" id="height-chip"><small data-i18n="game.height">Height</small><b><span id="agl">0</span><em>m</em><i id="vario" class="vario" aria-hidden="true"></i></b></div>
        <div class="g3d-chip"><small data-i18n="game.burst">Burst</small><b class="pips" id="charges" role="img" aria-label="3/3"></b></div>
        <div class="g3d-chip wind-chip" id="wind-chip" hidden><small data-i18n="game.wind">Wind</small><b><i id="wind-arrow" aria-hidden="true">→</i><span id="wind">0</span><em>m/s</em></b></div>
      </div>
      <div class="g3d-actions">
        <select id="language-select" class="g3d-select" data-i18n-aria="game.language" aria-label="Language / 語言">
          <option value="zh-TW">繁中</option>
          <option value="zh-CN">简中</option>
          <option value="en">EN</option>
          <option value="ja">日本語</option>
        </select>
        <button id="sound-btn" class="g3d-icon" type="button" data-i18n-aria="game.sound" aria-label="Toggle sound" aria-pressed="true">♪</button>
        <button id="pause-btn" class="g3d-icon" type="button" data-i18n-aria="game.pause" aria-label="Pause">❚❚</button>
      </div>
    </div>

    <div id="warn" class="warn" role="alert" hidden></div>
    <div id="hint" class="hint" aria-live="polite" hidden><span id="hint-text"></span><small id="grace" hidden></small></div>
    <div id="toast" class="g3d-toast" role="status" aria-live="polite"></div>

    <div class="g3d-touch" id="touch">
      <button id="burst-btn" class="burst-btn" type="button" data-i18n-aria="game.burstButton" aria-label="Burst">⇧</button>
    </div>

    <div id="overlay" class="g3d-overlay">
      <section class="g3d-panel" aria-labelledby="overlay-title">
        <div class="panel-head">
          <p class="g3d-kicker" id="overlay-kicker" data-i18n="game.kicker">WebGL 3D wingsuit flight</p>
          <h1 class="g3d-title" id="overlay-title" data-i18n="game.title">Ridge Glider</h1>
          <p class="g3d-lead" id="overlay-lead" data-i18n="game.lead"></p>
          <p class="result-line" id="result-line" hidden></p>
          <div id="result" class="g3d-result" hidden>
            <div><small data-i18n="game.score">Score</small><b id="result-score">0</b></div>
            <div><small data-i18n="game.distance">Distance</small><b><span id="result-distance">0</span> m</b></div>
            <div><small data-i18n="game.gates">Rings</small><b id="result-gates">0</b></div>
            <div><small data-i18n="game.bestChain">Best chain</small><b id="result-chain">0</b></div>
            <div class="best-cell"><small data-i18n="game.best">Best</small><b id="result-best">0</b><span id="new-best" class="g3d-badge" data-i18n="game.newBest" hidden>New best</span></div>
          </div>
        </div>
        <div class="panel-body">
          <div class="panel-actions">
            <ul class="g3d-keys" id="controls">
              <li><kbd id="key-climb">↑ / W</kbd><span data-i18n="game.keyClimb"></span></li>
              <li><kbd id="key-dive">↓ / S</kbd><span data-i18n="game.keyDive"></span></li>
              <li><kbd>← → / A D</kbd><span data-i18n="game.keyBank"></span></li>
              <li><kbd>Space</kbd><span data-i18n="game.keyBurst"></span></li>
              <li><kbd>P / Esc</kbd><span data-i18n="game.keyPause"></span></li>
              <li class="touch-only"><kbd data-i18n="game.touchStick"></kbd><span data-i18n="game.touchStickDesc"></span></li>
              <li class="touch-only"><kbd data-i18n="game.touchBurst"></kbd><span data-i18n="game.keyBurst"></span></li>
            </ul>
            <label class="invert-row" id="invert-row"><input type="checkbox" id="invert" /><span data-i18n="game.invert"></span></label>
            <button id="start-btn" class="g3d-btn" type="button" data-i18n="game.start">Jump</button>
          </div>
          <p class="g3d-note" id="tip" data-i18n="game.tip"></p>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
  <script type="module" src="../../../shared/shell.ts"></script>
</body>
</html>
