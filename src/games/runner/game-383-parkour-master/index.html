<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="天際線大逃亡 Skyline Getaway：WebGL 2.5D 屋頂追逐跑酷。警用無人機的探照燈在後面追，速度就是生命條；抓準時機翻越、滑鏟、蹬牆、翻滾來加速，穿過黃昏屋頂、霓虹雨巷、港口吊臂、遊樂園與車站天棚。" />
  <meta name="theme-color" content="#0b0716" />
  <title>天際線大逃亡 Skyline Getaway - Awesome Free Games 1000</title>
  <link rel="stylesheet" href="../../../shared/three/kit.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../../../shared/shell.css">
</head>
<body>
  <div class="g3d">
    <div id="stage" class="g3d-stage"></div>
    <div id="glare" class="glare" aria-hidden="true"></div>

    <div class="g3d-hud">
      <div class="g3d-stats">
        <div class="g3d-chip accent"><small data-i18n="game.distance">Distance</small><b><span id="distance">0</span> m</b></div>
        <div class="g3d-chip speed-chip" id="speed-chip">
          <small data-i18n="game.speed">Speed</small><b><span id="speed">0</span> <span class="unit">km/h</span></b>
          <div class="g3d-meter speed-meter"><i id="speed-fill"></i><span id="drone-tick" class="tick"></span></div>
        </div>
        <div class="g3d-chip margin-chip" id="margin-chip">
          <small data-i18n="game.margin">Lead</small><b><span id="margin">18</span> m</b>
          <div class="g3d-meter"><i id="margin-fill"></i></div>
        </div>
        <div class="g3d-chip combo-chip"><small data-i18n="game.combo">Flow</small><b id="combo">×0</b></div>
        <div class="g3d-chip district-chip"><small data-i18n="game.district">District</small><b id="district-name"></b></div>
      </div>
      <div class="g3d-actions">
        <select id="language-select" class="g3d-select" data-i18n-aria="game.language" aria-label="Language / 語言">
          <option value="zh-TW">繁中</option>
          <option value="zh-CN">简中</option>
          <option value="en">EN</option>
          <option value="ja">日本語</option>
        </select>
        <button id="sound-btn" class="g3d-icon" type="button" data-i18n-aria="game.sound" aria-label="Toggle sound" aria-pressed="true">♪</button>
        <button id="pause-btn" class="g3d-icon" type="button" data-i18n-aria="game.pause" aria-label="Pause">❚❚</button>
      </div>
    </div>

    <div id="toast" class="g3d-toast" role="status" aria-live="polite"></div>

    <div id="overlay" class="g3d-overlay">
      <section class="g3d-panel" aria-labelledby="overlay-title">
        <p class="g3d-kicker" id="overlay-kicker" data-i18n="game.kicker">WebGL rooftop chase</p>
        <h1 class="g3d-title" id="overlay-title" data-i18n="game.title">Skyline Getaway</h1>
        <p class="g3d-lead" id="overlay-lead" data-i18n="game.lead"></p>
        <div id="result" class="g3d-result" hidden>
          <div><small data-i18n="game.distance">Distance</small><b><span id="result-distance">0</span> m</b></div>
          <div><small data-i18n="game.best">Best</small><b><span id="result-best">0</span> m</b><span id="new-best" class="g3d-badge" data-i18n="game.newBest" hidden>New best</span></div>
          <div><small data-i18n="game.reached">District reached</small><b id="result-district">1</b></div>
          <div><small data-i18n="game.perfects">Clean moves</small><b id="result-perfects">0</b></div>
          <div><small data-i18n="game.bestCombo">Longest flow</small><b id="result-combo">×0</b></div>
          <div><small data-i18n="game.topSpeed">Top speed</small><b><span id="result-speed">0</span> <span class="unit">km/h</span></b></div>
        </div>
        <ul class="g3d-keys" id="controls">
          <li><kbd>Space / W / ↑</kbd><span data-i18n="game.keyJump"></span></li>
          <li><kbd>S / ↓</kbd><span data-i18n="game.keySlide"></span></li>
          <li><kbd>P / Esc</kbd><span data-i18n="game.keyPause"></span></li>
          <li class="touch-only"><kbd data-i18n="game.touchJump"></kbd><span data-i18n="game.keyJump"></span></li>
          <li class="touch-only"><kbd data-i18n="game.touchSlide"></kbd><span data-i18n="game.keySlide"></span></li>
        </ul>
        <button id="start-btn" class="g3d-btn" type="button" data-i18n="game.start">Start running</button>
        <p class="g3d-note" data-i18n="game.tip"></p>
      </section>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
  <script type="module" src="../../../shared/shell.ts"></script>
</body>
</html>
